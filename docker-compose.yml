# doc-harness - Docker Compose (producción/server)
#
# SOLO lo necesario para correr el proyecto. NO crea base de datos ni redis:
# en el server ya corren (misma red microservices-network que atiende):
#   - Redis compartida  → hostname "redis:6379"
#   - PostgreSQL        → el MISMO de atiende ("atiende-postgres", imagen
#                         pgvector/pgvector:pg16, usuario atiende) con una base
#                         "docharnes" propia que se crea SOLA en el boot.
#
# Uso en el server:
#   docker compose up -d          # levanta el api
#   docker compose logs -f
#   docker compose down
#
# En dev local (necesita postgres; reutiliza la redis compartida):
#   docker compose -f docker-compose.yml -f docker-compose.infra.yml up -d

services:
  # ─────────────────────────────────────────
  # API / harness (NestJS) — extracción, IA, render y workers BullMQ en el mismo proceso
  # ─────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      target: development
    container_name: docharnes-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${API_PORT:-3300}
      # Postgres EXTERNO: el de atiende (pgvector). Override en .env si cambia.
      DATABASE_URL: postgresql://${POSTGRES_USER:-atiende}:${POSTGRES_PASSWORD:-atiende_dev}@${DATABASE_HOST:-atiende-postgres}:${DATABASE_PORT:-5432}/${POSTGRES_DB:-docharnes}?schema=public
      # Redis compartida (ya corriendo como "redis" en la red).
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      QUEUE_PREFIX: ${QUEUE_PREFIX:-docharnes}
      # Dónde se guardan los archivos subidos y los generados (volumen nombrado).
      DOCS_STORAGE_DIR: /data
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/prisma:/app/prisma
      - ./apps/api/scripts:/app/scripts
      # Los archivos (input/output) viven fuera del bind mount de código.
      - docharnes_data:/data
    ports:
      - "${API_PORT:-3300}:3300"
    networks:
      - microservices-network

volumes:
  docharnes_data:
    name: docharnes_data

networks:
  microservices-network:
    external: true
